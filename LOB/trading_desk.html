<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trading Desk</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=JetBrains+Mono:wght@400;500;700&display=swap');

  :root {
    --bg: #0b0d10;
    --panel: #13161a;
    --line: #23272e;
    --ink: #e8e6df;
    --dim: #7b8188;
    --amber: #d4a24e;
    --green: #5fae7a;
    --red: #c15c5c;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: 'JetBrains Mono', monospace;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px 16px;
  }
  .desk {
    width: 100%;
    max-width: 480px;
  }
  .ticker {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.15em;
    color: var(--amber);
    text-transform: uppercase;
    margin-bottom: 8px;
  }
  h1 {
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 32px;
    margin: 0 0 28px 0;
    letter-spacing: -0.01em;
  }
  .toggle {
    display: flex;
    border: 1px solid var(--line);
    border-radius: 8px;
    overflow: hidden;
    margin-bottom: 24px;
  }
  .toggle button {
    flex: 1;
    padding: 14px;
    background: var(--panel);
    color: var(--dim);
    border: none;
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    cursor: pointer;
    transition: background 0.15s, color 0.15s;
  }
  .toggle button.active { background: var(--amber); color: #16130a; font-weight: 700; }
  .toggle button:not(.active):hover { color: var(--ink); }

  .panel {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 24px;
  }
  label {
    display: block;
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--dim);
    margin: 16px 0 6px 0;
  }
  label:first-of-type { margin-top: 0; }
  input {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 12px;
    color: var(--ink);
    font-family: 'JetBrains Mono', monospace;
    font-size: 15px;
  }
  input:focus { outline: none; border-color: var(--amber); }

  .submit {
    width: 100%;
    margin-top: 22px;
    padding: 14px;
    border: none;
    border-radius: 6px;
    background: var(--amber);
    color: #16130a;
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    cursor: pointer;
  }
  .submit:hover { filter: brightness(1.08); }
  .submit:disabled { opacity: 0.5; cursor: default; }

  .result {
    margin-top: 20px;
    padding: 16px;
    border-radius: 8px;
    border: 1px solid var(--line);
    font-size: 13px;
    line-height: 1.6;
    display: none;
  }
  .result.show { display: block; }
  .result .status-line {
    font-size: 12px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    font-weight: 700;
    margin-bottom: 6px;
  }
  .result.win { border-color: var(--green); }
  .result.win .status-line { color: var(--green); }
  .result.outbid { border-color: var(--red); }
  .result.outbid .status-line { color: var(--red); }
  .result.seller { border-color: var(--amber); }
  .result.seller .status-line { color: var(--amber); }
  .result .detail { color: var(--dim); }
</style>
</head>
<body>
<div class="desk">
  <div class="ticker">Auction Pipeline</div>
  <h1>Trading Desk</h1>

  <div class="toggle">
    <button id="btn-buyer" class="active" onclick="setRole('buyer')">Buyer</button>
    <button id="btn-seller" onclick="setRole('seller')">Seller</button>
  </div>

  <div class="panel">
    <label>Stock</label>
    <input id="stock_id" placeholder="AAPL_STOCK" autocomplete="off">

    <label>Your Name</label>
    <input id="party_name" placeholder="Acme Capital" autocomplete="off">

    <label id="price-label">Bid Price</label>
    <input id="price" type="number" step="0.01" placeholder="254.30">

    <label>Quantity</label>
    <input id="quantity" type="number" step="1" placeholder="200">

    <button class="submit" id="submit-btn" onclick="submitOrder()">Submit Bid</button>

    <div class="result" id="result">
      <div class="status-line" id="result-status"></div>
      <div class="detail" id="result-detail"></div>
    </div>
  </div>
</div>

<script>
let role = 'buyer';

function setRole(r) {
  role = r;
  document.getElementById('btn-buyer').classList.toggle('active', r === 'buyer');
  document.getElementById('btn-seller').classList.toggle('active', r === 'seller');
  document.getElementById('price-label').textContent = r === 'buyer' ? 'Bid Price' : 'Ask Price';
  document.getElementById('submit-btn').textContent = r === 'buyer' ? 'Submit Bid' : 'Set Ask Price';
  document.getElementById('result').classList.remove('show', 'win', 'outbid', 'seller');
}

async function submitOrder() {
  const stock_id = document.getElementById('stock_id').value.trim();
  const party_name = document.getElementById('party_name').value.trim();
  const price = parseFloat(document.getElementById('price').value);
  const quantity = parseFloat(document.getElementById('quantity').value);
  const resultEl = document.getElementById('result');
  const statusEl = document.getElementById('result-status');
  const detailEl = document.getElementById('result-detail');
  const btn = document.getElementById('submit-btn');

  if (!stock_id || !party_name || isNaN(price) || isNaN(quantity)) {
    resultEl.className = 'result show outbid';
    statusEl.textContent = 'Missing fields';
    detailEl.textContent = 'Fill in stock, name, price, and quantity before submitting.';
    return;
  }

  btn.disabled = true;
  btn.textContent = 'Submitting...';

  try {
    if (role === 'buyer') {
      const res = await fetch('/bids', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({buyer: party_name, stock_id, price, quantity})
      });
      const data = await res.json();

      if (!res.ok) {
        resultEl.className = 'result show outbid';
        statusEl.textContent = data.reason || data.error || 'Bid rejected';
        detailEl.textContent = 'Check your price against tick size and try again.';
      } else if (data.outbid) {
        resultEl.className = 'result show outbid';
        statusEl.textContent = 'You have been outbid';
        detailEl.textContent = `Current highest bid for ${stock_id} is ${data.current_highest_bid.toFixed(2)}. Submit a higher bid to compete.`;
      } else {
        resultEl.className = 'result show win';
        statusEl.textContent = 'Bid registered — currently leading';
        detailEl.textContent = 'Payment in progress. A confirmation email will be sent once the auction settles.';
      }
    } else {
      const res = await fetch('/asks', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({stock_id, price, quantity})
      });
      const data = await res.json();

      if (!res.ok) {
        resultEl.className = 'result show outbid';
        statusEl.textContent = data.error || 'Ask rejected';
        detailEl.textContent = '';
      } else {
        resultEl.className = 'result show seller';
        statusEl.textContent = 'Ask price updated';
        detailEl.textContent = `${stock_id} now asking ${data.resulting_best_ask.toFixed(2)} for ${data.resulting_qty} shares.`;
      }
    }
  } catch (e) {
    resultEl.className = 'result show outbid';
    statusEl.textContent = 'Connection error';
    detailEl.textContent = 'Could not reach the trading server. Is it running?';
  }

  btn.disabled = false;
  btn.textContent = role === 'buyer' ? 'Submit Bid' : 'Set Ask Price';
}
</script>
</body>
</html>
